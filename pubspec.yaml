name: btcmobick_coin_control
description: "Non-custodial BTCMobick UTXO coin-control wallet."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
